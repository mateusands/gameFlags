<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Sem maximum-scale/user-scalable: bloquear o zoom quebra a acessibilidade no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flag Guess Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 id="uiTitle">🌍 Adivinhe a Bandeira</h1>

    <div class="stats">
      <span><span id="uiScoreLabel">Pontos</span>: <strong id="score">0</strong></span>
      <span><span id="uiHighScoreLabel">Recorde</span>: <strong id="highScore">0</strong></span>
    </div>
  </header>

  <main>
    <div id="languageSelection">
      <h3>Select Language / Selecione o Idioma</h3>
      <button class="lang-btn" onclick="setLanguage('en')">🇺🇸 English</button>
      <button class="lang-btn" onclick="setLanguage('pt')">🇧🇷 Português</button>
      <button class="lang-btn" onclick="setLanguage('es')">🇪🇸 Español</button>
      <button class="lang-btn" onclick="setLanguage('ja')">🇯🇵 日本語</button>
      <button class="lang-btn" onclick="setLanguage('zh')">🇨🇳 中文</button>
      <button class="lang-btn" onclick="setLanguage('ko')">🇰🇷 한국어</button>
      <button class="lang-btn" onclick="setLanguage('ru')">🇷🇺 Русский</button>
      <button class="lang-btn" onclick="setLanguage('fr')">🇫🇷 Français</button>
      <button class="lang-btn" onclick="setLanguage('it')">🇮🇹 Italiano</button>
    </div>

    <div id="gameContainer" class="hidden">
      <div class="timer-box">
        ⏱️ <span id="timer">5</span>s
      </div>

      <!-- alt genérico de propósito: o nome do país entregaria a resposta -->
      <img id="flag" alt="Flag" style="display:none">

      <div id="options"></div>

      <button id="startBtn" class="hidden">Iniciar Jogo</button>

      <button id="backBtn" onclick="goBackToMenu()">← Mudar Idioma</button>
    </div>
  </main>

  <!-- Aviso de falha de rede. Fica acima do overlay de game over de propósito -->
  <p id="message" class="hidden" role="status" aria-live="polite"></p>

  <div id="gameOver" class="hidden">
    <h2 id="uiGameOver">💀 Você perdeu!</h2>
    <p><span id="uiFinalScoreLabel">Pontuação final:</span> <strong id="finalScore">0</strong></p>
    <button id="restartBtn">Recomeçar</button>
    <button id="gameOverBackBtn">← Mudar Idioma</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
